<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>טיול בודפשט</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#F5F3EF; --bg-soft:#FBFAF7; --stone:#E9E4DD;
  --accent:#B89B7A; --accent-deep:#6E5A44; --accent-soft:#EFE7DC;
  --ink:#1B1A18; --ink-soft:#3A3631; --muted:#6B655E; --done:#9C9389;
  --font-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-label:"Jost","Heebo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191714; --bg-soft:#221F1B; --stone:#34302A;
  --accent:#C9AE8D; --accent-deep:#E2CDB2; --accent-soft:#2B2620;
  --ink:#F3EFE9; --ink-soft:#DDD6CC; --muted:#A8A096; --done:#7D766D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191714; --bg-soft:#221F1B; --stone:#34302A;
  --accent:#C9AE8D; --accent-deep:#E2CDB2; --accent-soft:#2B2620;
  --ink:#F3EFE9; --ink-soft:#DDD6CC; --muted:#A8A096; --done:#7D766D; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:76px}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
a{color:var(--accent-deep)}

.hero{background:var(--accent-soft);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{padding-block:22px 24px;text-align:center}
.hero svg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto 4px}
.eyebrow{font-family:var(--font-label);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);margin:6px 0 4px}
h1{font-size:clamp(30px,8vw,40px);font-weight:700;line-height:1.1;margin:0}
.sub{color:var(--muted);margin:8px 0 0;font-size:16px}
.sub a{white-space:nowrap}

.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.chip{flex:1 0 auto;text-decoration:none;text-align:center;border:1px solid var(--stone);background:var(--bg-soft);color:var(--ink-soft);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.25;min-width:58px}
.chip b{display:block;font-weight:500;color:var(--ink)}
.chip.today{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.today b{color:var(--bg)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 4px}
button{font:inherit;font-size:15px;border-radius:99px;padding:9px 18px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.solid{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:20}

section{margin-top:22px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
h2{font-size:21px;font-weight:700;margin:0;line-height:1.25}
.dayhead .date{font-family:var(--font-label);font-size:13px;letter-spacing:.16em;color:var(--accent-deep);white-space:nowrap}
.daytitle{color:var(--muted);font-size:15px;margin:-4px 2px 8px}
.todaytag{font-family:var(--font-label);font-size:12px;letter-spacing:.12em;background:var(--accent-deep);color:var(--bg);border-radius:99px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle}
h3{font-family:var(--font-label);font-weight:500;font-size:13px;letter-spacing:.18em;color:var(--accent-deep);margin:0 2px 8px;display:flex;justify-content:space-between}

ul{list-style:none;margin:0;padding:0;background:var(--bg-soft);border:1px solid var(--stone);border-radius:16px;overflow:hidden}
li+li{border-top:1px solid var(--stone)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;min-height:56px}
.time{flex:none;width:58px;font-family:var(--font-label);font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent-deep);padding-top:2px;text-align:start}
.txt{flex:1;min-width:0}
.name{display:block;font-weight:500}
.note{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.map{flex:none;font-size:13px;text-decoration:none;border:1px solid var(--stone);border-radius:99px;padding:3px 10px;color:var(--accent-deep);white-space:nowrap;margin-top:1px}
li.done .name{color:var(--done);text-decoration:line-through;text-decoration-color:var(--accent)}
li.done .time{color:var(--done)}

.checkrow{display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:56px;cursor:pointer;user-select:none;flex:1;min-width:0}
input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;transition:background .2s}
.box svg{width:15px;height:15px;stroke:var(--bg-soft);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s}
input:checked+.box{background:var(--accent-deep);border-color:var(--accent-deep)}
input:checked+.box svg{stroke-dashoffset:0}
input:checked~.txt .name{color:var(--done);text-decoration:line-through;text-decoration-color:var(--accent)}
input:focus-visible+.box{outline:2px solid var(--ink);outline-offset:3px}
.todo li{display:flex;align-items:center}

/* edit mode */
.ed{padding:12px 14px;display:grid;grid-template-columns:72px 1fr;gap:6px}
.ed input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--stone);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.ed input:focus,textarea:focus,.addtodo input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ed .full{grid-column:1 / -1}
.ed .acts{grid-column:1 / -1;display:flex;gap:6px;justify-content:flex-end}
.ed .acts button,.mini{font-size:14px;padding:5px 12px;border-color:var(--stone);color:var(--ink-soft)}
.mini.danger{color:#A2453A;border-color:currentColor}
.addrow{display:flex;justify-content:center;padding:10px}
.dayedit{display:grid;gap:6px;margin:0 0 8px}
.dayedit input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg-soft);border:1px solid var(--stone);border-radius:10px;padding:8px 10px}
.del{flex:none;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:8px 14px;border-radius:8px}
.addtodo{display:flex;gap:8px;margin-top:10px}
.addtodo input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg-soft);border:1px solid var(--stone);border-radius:14px;padding:12px 14px;min-width:0}
.addtodo input{flex:1}
textarea{width:100%;resize:vertical;display:block}
.footer{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ask{color:var(--ink-soft);font-size:15px;text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <svg viewBox="0 0 300 120" role="img" aria-label="ציור קו של גשר מעל הדנובה וכוכבים">
      <path d="M10 92 H290" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
      <path d="M20 104 C 60 98, 90 110, 130 104 S 200 98, 240 104 S 280 108, 290 104" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".45"/>
      <g stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M95 92 V40 H115 V92"/><path d="M185 92 V40 H205 V92"/>
        <path d="M95 52 H115 M185 52 H205"/>
        <path d="M30 92 C 60 80, 80 54, 105 42 C 130 60, 170 60, 195 42 C 220 54, 240 80, 270 92"/>
      </g>
      <g fill="var(--accent)">
        <circle cx="150" cy="18" r="3"/><circle cx="60" cy="28" r="2"/><circle cx="242" cy="24" r="2.5"/><circle cx="30" cy="56" r="1.6"/><circle cx="272" cy="54" r="1.6"/>
      </g>
    </svg>
    <p class="eyebrow">Budapest 2026</p>
    <h1>בודפשט <span dir="ltr">1–6.12</span></h1>
    <p class="sub">תחרות, שווקים ואורות · <a href="./">לצ'ק ליסט של התיק</a></p>
  </div>
</header>

<main class="wrap">
  <nav class="days" id="chips" aria-label="ימים"></nav>

  <div class="toolbar">
    <button type="button" class="solid" id="editBtn">עריכה</button>
    <button type="button" id="shareBtn">שליחה בוואטסאפ</button>
  </div>
  <p class="hint" id="hint" hidden>השינויים נשמרים בטלפון הזה בלבד. כדי לעדכן את כולם – "שליחה בוואטסאפ".</p>

  <div id="daysWrap"></div>

  <section>
    <h3><span>לסגור מראש</span><span id="todoCount"></span></h3>
    <ul class="todo" id="todoList"></ul>
    <form class="addtodo" id="todoForm">
      <input type="text" id="todoInput" placeholder="להוסיף משימה" aria-label="משימה חדשה" maxlength="90" autocomplete="off">
      <button type="submit" class="solid">הוספה</button>
    </form>
  </section>

  <section>
    <h3><span>הערות</span></h3>
    <textarea id="notes" rows="4" placeholder="שם המלון, מספר טיסה, טלפון של המאמנת..."></textarea>
  </section>

  <div class="footer" id="resetArea"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const DEFAULT = {
  days: [
    { id:"d1", short:"שלישי", date:"1.12", title:"נחיתה", items:[
      { time:"לילה", text:"נחיתה, מונית למלון ושינה" }
    ]},
    { id:"d2", short:"רביעי", date:"2.12", title:"אימון ושווקים", items:[
      { time:"10:00", text:"תצפית על הפרלמנט והדנובה + קפה", note:"נקודה אחת, בלי הליכה ארוכה", map:"Parliament Budapest" },
      { time:"11:30", text:"צהריים מוקדם וקל" },
      { time:"12:15", text:"מונית לאימון" },
      { time:"14:00", text:"אימון", note:"עד 16:00" },
      { time:"ערב", text:"שוק חג המולד בבזיליקה", note:"מופע אורות על החזית · ארוחה קלה וחוזרים מוקדם", map:"Advent Bazilika Budapest" }
    ]},
    { id:"d3", short:"חמישי", date:"3.12", title:"קרקס · בניה מגיע", items:[
      { time:"בוקר", text:"מבצר הדייגים", note:"שעה, בשביל הנוף · עולים ברכבל", map:"Fisherman's Bastion Budapest" },
      { time:"צהריים", text:"ארוחה ומנוחה" },
      { time:"15:00", text:"קרקס", note:"עד ~17:30", map:"Fővárosi Nagycirkusz" },
      { time:"ערב", text:"ערב רגוע ולישון מוקדם", note:"מחר תחרות" }
    ]},
    { id:"d4", short:"שישי", date:"4.12", title:"יום התחרות", items:[
      { time:"בוקר", text:"תחרות בארנה 🤸‍♀️" },
      { time:"15:30", text:"פודיום 🏅" },
      { time:"15:36", text:"כניסת שבת", note:"אחותי והמשפחה הולכים ברגל לרובע היהודי (~40 דק')" },
      { time:"אחה\"צ", text:"מקלחת והחלפת בגדים במלון" },
      { time:"18:00", text:"מגיעים לבית חב\"ד", note:"לוודא כתובת" },
      { time:"19:00", text:"ארוחת שישי בבית חב\"ד", note:"כולם יחד" },
      { time:"אם יש כוח", text:"שוק בכיכר Vörösmarty", note:"~15 דק' הליכה · נסגר ~22:00", map:"Vörösmarty tér Budapest" }
    ]},
    { id:"d5", short:"שבת", date:"5.12", title:"ואצי, שווקים והחלקה", items:[
      { time:"בוקר", text:"השוק המקורה הגדול", note:"להגיע בבוקר · נסגר מוקדם בשבת", map:"Great Market Hall Budapest" },
      { time:"צהריים", text:"רחוב ואצי – שופינג וצהריים", map:"Váci utca Budapest" },
      { time:"", text:"אחותי והמשפחה: שבת בקצב שלהם" },
      { time:"אחה\"צ", text:"מנוחה ואריזה" },
      { time:"17:00", text:"החלקה בפארק העירוני ⛸️", note:"כולם יחד · צאת שבת ~16:45", map:"Városligeti Műjégpálya" },
      { time:"ערב", text:"ארוחת ערב, מזוודות ושדה ✈️" }
    ]}
  ],
  todos: [
    { text:"כרטיסים לקרקס – חמישי 15:00 (fnc.hu)" },
    { text:"תשלום מראש לארוחת שישי בבית חב\"ד + לוודא כתובת" },
    { text:"כרטיסים להחלקה + לוודא שעות במוצ\"ש (mujegpalya.hu)" },
    { text:"שעת הטיסה המדויקת" },
    { text:"שמירת מזוודות במלון בשבת" }
  ]
};
const TRIP_DATES = { d1:"2026-12-01", d2:"2026-12-02", d3:"2026-12-03", d4:"2026-12-04", d5:"2026-12-05" };

const KEY = "budapest-trip-v1";
let uid = Date.now();
const nid = () => "x" + (uid++).toString(36);
function fresh(){
  const s = JSON.parse(JSON.stringify(DEFAULT));
  s.days.forEach(d => d.items.forEach(i => { i.id = nid(); i.done = false; }));
  s.todos.forEach(t => { t.id = nid(); t.done = false; });
  s.notes = "";
  return s;
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
if (!state || !Array.isArray(state.days)) state = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

let editing = false;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tick = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

const now = new Date();
const todayISO = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
const todayId = Object.keys(TRIP_DATES).find(k => TRIP_DATES[k] === todayISO);

function renderChips(){
  document.getElementById("chips").innerHTML = state.days.map(d =>
    `<a class="chip${d.id === todayId ? " today" : ""}" href="#${d.id}"><b>${esc(d.short)}</b>${esc(d.date)}</a>`).join("");
}

function renderDays(){
  const wrap = document.getElementById("daysWrap");
  wrap.innerHTML = state.days.map(d => {
    const head = editing
      ? `<div class="dayedit"><input data-day="${d.id}" data-f="title" value="${esc(d.title)}" aria-label="כותרת היום"></div>`
      : (d.title ? `<p class="daytitle">${esc(d.title)}</p>` : "");
    const items = d.items.map((it, idx) => editing ? `
      <li><div class="ed">
        <input data-day="${d.id}" data-it="${it.id}" data-f="time" value="${esc(it.time)}" placeholder="שעה" aria-label="שעה">
        <input data-day="${d.id}" data-it="${it.id}" data-f="text" value="${esc(it.text)}" placeholder="מה עושים" aria-label="מה עושים">
        <input class="full" data-day="${d.id}" data-it="${it.id}" data-f="note" value="${esc(it.note)}" placeholder="הערה (לא חובה)" aria-label="הערה">
        <input class="full" data-day="${d.id}" data-it="${it.id}" data-f="map" value="${esc(it.map)}" placeholder="מקום למפה (לא חובה)" aria-label="מקום למפה">
        <div class="acts">
          <button type="button" class="mini" data-act="up" data-day="${d.id}" data-it="${it.id}" ${idx === 0 ? "disabled" : ""} aria-label="להזיז למעלה">↑</button>
          <button type="button" class="mini" data-act="down" data-day="${d.id}" data-it="${it.id}" ${idx === d.items.length - 1 ? "disabled" : ""} aria-label="להזיז למטה">↓</button>
          <button type="button" class="mini danger" data-act="del" data-day="${d.id}" data-it="${it.id}">מחיקה</button>
        </div>
      </div></li>` : `
      <li class="${it.done ? "done" : ""}"><div class="row">
        <span class="time">${esc(it.time)}</span>
        <span class="txt"><span class="name">${esc(it.text)}</span>${it.note ? `<span class="note">${esc(it.note)}</span>` : ""}</span>
        ${it.map ? `<a class="map" href="${mapUrl(it.map)}" target="_blank" rel="noopener">מפה</a>` : ""}
      </div></li>`).join("");
    const add = editing ? `<li class="addrow"><button type="button" class="mini" data-act="add" data-day="${d.id}">+ להוסיף ליום הזה</button></li>` : "";
    return `<section id="${d.id}">
      <div class="dayhead"><h2>${esc(d.short)}${d.id === todayId ? '<span class="todaytag">היום</span>' : ""}</h2><span class="date">${esc(d.date)}</span></div>
      ${head}
      <ul>${items || (editing ? "" : '<li><div class="row"><span class="note">אין עדיין תוכנית</span></div></li>')}${add}</ul>
    </section>`;
  }).join("");
}

document.getElementById("daysWrap").addEventListener("input", e => {
  const el = e.target; if (!el.dataset.f) return;
  const day = state.days.find(d => d.id === el.dataset.day); if (!day) return;
  if (el.dataset.it) { const it = day.items.find(i => i.id === el.dataset.it); if (it) it[el.dataset.f] = el.value; }
  else day[el.dataset.f] = el.value;
  save();
});
document.getElementById("daysWrap").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const day = state.days.find(d => d.id === b.dataset.day); if (!day) return;
  const i = day.items.findIndex(x => x.id === b.dataset.it);
  if (b.dataset.act === "add") { day.items.push({ id:nid(), time:"", text:"", note:"", map:"", done:false }); }
  if (b.dataset.act === "del" && i > -1) day.items.splice(i, 1);
  if (b.dataset.act === "up" && i > 0) [day.items[i-1], day.items[i]] = [day.items[i], day.items[i-1]];
  if (b.dataset.act === "down" && i > -1 && i < day.items.length - 1) [day.items[i+1], day.items[i]] = [day.items[i], day.items[i+1]];
  save(); renderDays();
  if (b.dataset.act === "add") { const ins = document.querySelectorAll(`#${day.id} .ed`); const last = ins[ins.length-1]; last && last.querySelector('[data-f="time"]').focus(); }
});

function renderTodos(){
  const ul = document.getElementById("todoList");
  ul.innerHTML = state.todos.map(t => `
    <li><label class="checkrow">
      <input type="checkbox" data-todo="${t.id}" ${t.done ? "checked" : ""}>
      <span class="box">${tick}</span>
      <span class="txt"><span class="name">${esc(t.text)}</span></span>
    </label>${editing ? `<button type="button" class="del" data-deltodo="${t.id}" aria-label="למחוק">×</button>` : ""}</li>`).join("");
  ul.hidden = state.todos.length === 0;
  const n = state.todos.filter(t => t.done).length;
  document.getElementById("todoCount").textContent = state.todos.length ? `${n}/${state.todos.length}` : "";
}
document.getElementById("todoList").addEventListener("change", e => {
  const t = state.todos.find(x => x.id === e.target.dataset.todo); if (!t) return;
  t.done = e.target.checked; save(); renderTodos();
});
document.getElementById("todoList").addEventListener("click", e => {
  const b = e.target.closest("[data-deltodo]"); if (!b) return;
  state.todos = state.todos.filter(t => t.id !== b.dataset.deltodo); save(); renderTodos();
});
document.getElementById("todoForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("todoInput"), text = inp.value.trim(); if (!text) return;
  state.todos.push({ id:nid(), text, done:false }); save(); inp.value = ""; renderTodos();
});

const notes = document.getElementById("notes");
notes.value = state.notes || "";
notes.addEventListener("input", () => { state.notes = notes.value; save(); });

document.getElementById("editBtn").addEventListener("click", () => {
  editing = !editing;
  if (!editing) state.days.forEach(d => d.items = d.items.filter(i => (i.text || "").trim() || (i.time || "").trim()));
  save();
  document.getElementById("editBtn").textContent = editing ? "סיום עריכה" : "עריכה";
  document.getElementById("hint").hidden = !editing;
  renderDays(); renderTodos(); renderReset();
});

function asText(){
  let out = "🇭🇺 בודפשט 1–6.12\n";
  state.days.forEach(d => {
    out += `\n*${d.short} ${d.date}${d.title ? " – " + d.title : ""}*\n`;
    d.items.forEach(i => { out += `• ${i.time ? i.time + " " : ""}${i.text}${i.note ? " (" + i.note + ")" : ""}\n`; });
  });
  const open = state.todos.filter(t => !t.done);
  if (open.length) { out += "\n*לסגור מראש ✅*\n"; open.forEach(t => out += `• ${t.text}\n`); }
  return out.trim();
}
const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); };
document.getElementById("shareBtn").addEventListener("click", async () => {
  const text = asText();
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); toast("הועתק – אפשר להדביק בוואטסאפ"); }
  catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener"); }
});

const area = document.getElementById("resetArea");
function renderReset(){
  if (!editing) { area.innerHTML = ""; return; }
  area.innerHTML = '<button type="button" id="resetBtn">לחזור לתוכנית המקורית</button>';
  document.getElementById("resetBtn").onclick = () => {
    area.innerHTML = '<p class="ask">למחוק את כל השינויים בטלפון הזה?</p><div class="toolbar"><button type="button" class="solid" id="yes">כן, לחזור למקור</button><button type="button" id="no">ביטול</button></div>';
    document.getElementById("yes").onclick = () => { const n = state.notes; state = fresh(); state.notes = n; save(); renderChips(); renderDays(); renderTodos(); renderReset(); toast("חזרנו לתוכנית המקורית"); };
    document.getElementById("no").onclick = renderReset;
  };
}

renderChips(); renderDays(); renderTodos(); renderReset();
if (todayId && !location.hash) setTimeout(() => document.getElementById(todayId)?.scrollIntoView(), 50);
</script>
</body>
</html>
